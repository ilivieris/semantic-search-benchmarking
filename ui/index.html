<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ΦΕΚ Search Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #06091a;
      --bg-2:     #0b1028;
      --bg-card:  rgba(255,255,255,0.032);
      --border:   rgba(255,255,255,0.07);
      --border-h: rgba(255,255,255,0.14);
      --blue:     #3b82f6;
      --purple:   #8b5cf6;
      --cyan:     #06b6d4;
      --green:    #10b981;
      --yellow:   #f59e0b;
      --orange:   #f97316;
      --red:      #ef4444;
      --text:     #e2e8f0;
      --text-2:   #94a3b8;
      --text-3:   #3f4f68;
      --r:        12px;
      --r-sm:     8px;
      --r-pill:   999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Global glow blobs ──────────────────────────────────── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    .blob-1 { width:600px;height:600px;top:-200px;left:-150px;  background:radial-gradient(circle,rgba(59,130,246,0.15),transparent 70%); }
    .blob-2 { width:500px;height:500px;bottom:-150px;right:-100px;background:radial-gradient(circle,rgba(139,92,246,0.12),transparent 70%); }
    .blob-3 { width:300px;height:300px;top:40%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(6,182,212,0.06),transparent 70%); }

    /* ── Noise texture overlay ──────────────────────────────── */
    body::after {
      content:'';
      position:fixed;inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none;
      z-index:0;
      opacity:.4;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 58px;
      background: rgba(6,9,26,0.75);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .logo { display:flex;align-items:center;gap:11px; }
    .logo-mark {
      width:34px;height:34px;
      background: linear-gradient(135deg,#3b82f6,#8b5cf6);
      border-radius:9px;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:800;letter-spacing:-0.5px;
      box-shadow:0 4px 14px rgba(59,130,246,0.35);
    }
    .logo-name { font-size:15px;font-weight:700;letter-spacing:-0.4px; }
    .logo-tag  { font-size:10px;color:var(--text-3);font-weight:400;margin-top:1px; }

    .header-right { display:flex;align-items:center;gap:16px; }
    .pill-badge {
      font-size:10px;font-weight:600;letter-spacing:0.5px;
      padding:3px 10px;border-radius:var(--r-pill);
      background:rgba(255,255,255,0.05);border:1px solid var(--border);
      color:var(--text-3);font-family:'JetBrains Mono',monospace;
    }
    .api-status {
      display:flex;align-items:center;gap:6px;
      font-size:12px;color:var(--text-2);
    }
    .dot {
      width:7px;height:7px;border-radius:50%;
      background:var(--text-3);transition:all .3s;
    }
    .dot.on  { background:var(--green);box-shadow:0 0 7px var(--green); }
    .dot.off { background:var(--red);  box-shadow:0 0 7px var(--red); }

    /* ── Hero ───────────────────────────────────────────────── */
    .hero {
      position:relative;z-index:1;
      padding:72px 24px 44px;
      text-align:center;
    }
    .hero-eyebrow {
      display:inline-flex;align-items:center;gap:7px;
      padding:5px 14px;border-radius:var(--r-pill);
      background:rgba(59,130,246,0.09);
      border:1px solid rgba(59,130,246,0.22);
      font-size:11px;font-weight:600;color:#93c5fd;
      letter-spacing:0.4px;margin-bottom:22px;
    }
    .hero-eyebrow svg { opacity:.7; }
    h1 {
      font-size:clamp(32px,5.5vw,58px);
      font-weight:800;letter-spacing:-2px;line-height:1.05;
      margin-bottom:16px;
      background:linear-gradient(160deg,#f1f5f9 20%,#64748b 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    h1 span {
      background:linear-gradient(135deg,#3b82f6,#8b5cf6);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .hero-sub {
      font-size:15px;color:var(--text-2);max-width:460px;
      margin:0 auto 40px;line-height:1.65;font-weight:400;
    }

    /* ── Search bar ─────────────────────────────────────────── */
    .search-wrap {
      max-width:680px;margin:0 auto;
      position:relative;
    }
    .search-input {
      width:100%;
      background:rgba(255,255,255,0.045);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:var(--r-pill);
      padding:17px 64px;
      font-size:15px;font-family:'Inter',sans-serif;
      color:var(--text);outline:none;
      transition:border-color .2s,box-shadow .2s,background .2s;
    }
    .search-input::placeholder { color:var(--text-3); }
    .search-input:focus {
      border-color:rgba(59,130,246,0.5);
      background:rgba(255,255,255,0.065);
      box-shadow:0 0 0 4px rgba(59,130,246,0.1),0 12px 40px rgba(0,0,0,0.35);
    }
    .search-ico {
      position:absolute;left:22px;top:50%;transform:translateY(-50%);
      color:var(--text-3);transition:color .2s;pointer-events:none;
    }
    .search-wrap:focus-within .search-ico { color:var(--blue); }
    .search-kbd {
      position:absolute;right:22px;top:50%;transform:translateY(-50%);
      font-size:11px;color:var(--text-3);padding:3px 8px;
      border:1px solid var(--border);border-radius:6px;
      background:rgba(255,255,255,0.03);
      font-family:'JetBrains Mono',monospace;transition:opacity .2s;
    }
    .search-spin {
      position:absolute;right:22px;top:50%;transform:translateY(-50%);
      display:none;
    }
    .search-spin.show { display:block; }
    .spinner {
      width:18px;height:18px;
      border:2px solid var(--border);border-top-color:var(--blue);
      border-radius:50%;animation:spin .7s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg);} }

    /* ── Controls ───────────────────────────────────────────── */
    .controls {
      position:relative;z-index:1;
      max-width:740px;margin:0 auto;
      padding:0 24px 36px;
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;flex-wrap:wrap;
    }
    .tabs {
      display:flex;
      background:rgba(255,255,255,0.04);
      border:1px solid var(--border);border-radius:var(--r-pill);
      padding:4px;gap:2px;
    }
    .tab {
      padding:7px 20px;border-radius:var(--r-pill);
      border:none;background:transparent;
      color:var(--text-3);cursor:pointer;
      font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
      letter-spacing:0.6px;transition:all .2s;white-space:nowrap;
    }
    .tab:hover { color:var(--text-2); }
    .tab.active {
      background:linear-gradient(135deg,var(--blue),var(--purple));
      color:#fff;box-shadow:0 2px 12px rgba(59,130,246,0.35);
    }
    .tab.active.cmp { background:linear-gradient(135deg,var(--cyan),var(--blue)); }

    .topk-wrap {
      display:flex;align-items:center;gap:8px;
      font-size:12px;color:var(--text-3);
    }
    select {
      background:rgba(255,255,255,0.05);
      border:1px solid var(--border);border-radius:var(--r-sm);
      color:var(--text);font-family:'Inter',sans-serif;
      font-size:13px;padding:6px 10px;outline:none;cursor:pointer;
      transition:border-color .2s;
    }
    select:focus { border-color:var(--blue); }

    /* ── Main ───────────────────────────────────────────────── */
    main {
      position:relative;z-index:1;
      max-width:1100px;margin:0 auto;
      padding:0 24px 100px;
    }

    /* ── Stats bar ──────────────────────────────────────────── */
    .stats {
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:18px;
      font-size:12px;color:var(--text-3);
    }
    .stats strong { color:var(--text-2);font-weight:600; }
    .stats-time {
      font-family:'JetBrains Mono',monospace;font-size:11px;
      padding:3px 9px;border-radius:6px;
      background:rgba(255,255,255,0.04);border:1px solid var(--border);
    }

    /* ── Results grid ───────────────────────────────────────── */
    .results-grid { display:grid;gap:24px; }
    .results-grid.cmp { grid-template-columns:1fr 1fr; }
    @media(max-width:720px) { .results-grid.cmp { grid-template-columns:1fr; } }

    .col { display:flex;flex-direction:column;gap:10px; }
    .col-head {
      display:flex;align-items:center;gap:8px;
      padding:9px 16px;border-radius:var(--r-sm);
      font-size:10px;font-weight:700;letter-spacing:1.2px;
      text-transform:uppercase;margin-bottom:4px;
    }
    .col-head.mpnet     { background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.18);color:#93c5fd; }
    .col-head.novelcore { background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.18);color:#c4b5fd; }
    .col-dot { width:6px;height:6px;border-radius:50%; }
    .mpnet     .col-dot { background:var(--blue); }
    .novelcore .col-dot { background:var(--purple); }

    /* ── Result card ────────────────────────────────────────── */
    .card {
      background:var(--bg-card);
      border:1px solid var(--border);border-radius:var(--r);
      padding:18px 20px;
      transition:border-color .2s,transform .18s,box-shadow .18s;
      animation:fadeUp .28s ease both;
    }
    .card:hover {
      border-color:var(--border-h);
      transform:translateY(-1px);
      box-shadow:0 12px 36px rgba(0,0,0,0.22);
    }
    .card:nth-child(1){animation-delay:0ms}
    .card:nth-child(2){animation-delay:45ms}
    .card:nth-child(3){animation-delay:90ms}
    .card:nth-child(4){animation-delay:135ms}
    .card:nth-child(5){animation-delay:180ms}
    @keyframes fadeUp {
      from{opacity:0;transform:translateY(10px)}
      to  {opacity:1;transform:translateY(0)}
    }

    .card-top {
      display:flex;align-items:flex-start;justify-content:space-between;
      gap:12px;margin-bottom:12px;
    }
    .card-rank {
      font-size:11px;font-weight:500;color:var(--text-3);
      font-family:'JetBrains Mono',monospace;min-width:22px;
      padding-top:2px;
    }
    .card-title {
      font-size:13px;font-weight:600;color:var(--text);
      line-height:1.45;flex:1;
    }
    .card-title.empty { color:var(--text-3);font-style:italic; }

    /* Score badge */
    .score {
      display:flex;align-items:center;gap:6px;flex-shrink:0;
      padding:4px 10px;border-radius:var(--r-pill);
      font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;
    }
    .score.high   { background:rgba(16,185,129,.11);color:#34d399;border:1px solid rgba(16,185,129,.2); }
    .score.mid    { background:rgba(245,158,11,.11); color:#fbbf24;border:1px solid rgba(245,158,11,.2); }
    .score.low    { background:rgba(249,115,22,.11); color:#fb923c;border:1px solid rgba(249,115,22,.2); }
    .score.poor   { background:rgba(239,68,68,.11);  color:#f87171;border:1px solid rgba(239,68,68,.2);  }
    .score-mini-bar {
      width:28px;height:3px;background:rgba(255,255,255,0.1);
      border-radius:99px;overflow:hidden;
    }
    .score-mini-fill { height:100%;border-radius:99px; }

    /* Meta chips */
    .card-meta { display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px; }
    .chip {
      font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;
      padding:3px 8px;border-radius:5px;letter-spacing:0.2px;
    }
    .chip-fek  { background:rgba(59,130,246,0.12);color:#93c5fd; }
    .chip-type { background:rgba(16,185,129,0.1); color:#6ee7b7; }
    .chip-date { background:rgba(255,255,255,0.05);color:var(--text-3); }

    /* Text preview */
    .card-text {
      font-size:12px;color:var(--text-2);line-height:1.65;
      overflow:hidden;display:-webkit-box;
      -webkit-line-clamp:3;-webkit-box-orient:vertical;
    }
    .card-text.open { display:block;-webkit-line-clamp:unset; }
    .expand {
      background:none;border:none;
      color:var(--blue);font-size:11px;font-weight:500;
      font-family:'Inter',sans-serif;cursor:pointer;
      padding:5px 0 0;display:block;
    }
    .expand:hover { color:#93c5fd; }

    /* ── Skeleton ────────────────────────────────────────────── */
    @keyframes shimmer { to{background-position:-400% 0} }
    .sk {
      animation:shimmer 1.5s infinite linear;
      background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);
      background-size:400% 100%;
      border-radius:5px;
    }
    .sk-card {
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--r);padding:18px 20px;
    }
    .sk-line { height:11px;border-radius:4px;margin-bottom:8px; }

    /* ── States ──────────────────────────────────────────────── */
    .state {
      text-align:center;padding:90px 20px;
      color:var(--text-3);animation:fadeUp .3s ease;
    }
    .state-icon { font-size:44px;margin-bottom:14px; }
    .state h3 { font-size:17px;color:var(--text-2);margin-bottom:7px;font-weight:600; }
    .state p  { font-size:13px;line-height:1.6; }
    .state code {
      font-family:'JetBrains Mono',monospace;color:var(--blue);
      background:rgba(59,130,246,0.1);padding:1px 6px;border-radius:4px;
    }

    /* ── Generate Query button ──────────────────────────────────── */
    .gen-row {
      display:flex;justify-content:center;
      margin-top:18px;
    }
    .gen-btn {
      display:inline-flex;align-items:center;gap:8px;
      padding:9px 22px;border-radius:var(--r-pill);
      border:1px solid rgba(139,92,246,0.35);
      background:rgba(139,92,246,0.08);
      color:#c4b5fd;
      font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
      letter-spacing:0.3px;cursor:pointer;
      transition:all .2s;
    }
    .gen-btn:hover:not(:disabled) {
      background:rgba(139,92,246,0.16);
      border-color:rgba(139,92,246,0.55);
      box-shadow:0 0 20px rgba(139,92,246,0.2);
      transform:translateY(-1px);
    }
    .gen-btn:active:not(:disabled) { transform:translateY(0); }
    .gen-btn:disabled { opacity:.55;cursor:not-allowed; }
    .gen-btn .spinner { width:14px;height:14px;border-width:1.5px; }
    .gen-btn-spin { display:none; }
    .gen-btn-spin.show { display:block; }

    /* ── Answer panel ───────────────────────────────────────────── */
    .answer-panel {
      position:relative;z-index:1;
      max-width:680px;margin:20px auto 0;
      background:rgba(139,92,246,0.06);
      border:1px solid rgba(139,92,246,0.22);
      border-radius:var(--r);padding:20px 22px;
      animation:fadeUp .3s ease both;
      text-align:left;
    }
    .answer-head {
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:16px;
    }
    .answer-badge {
      display:inline-flex;align-items:center;gap:6px;
      font-size:10px;font-weight:700;letter-spacing:0.8px;
      text-transform:uppercase;color:#c4b5fd;
      background:rgba(139,92,246,0.12);
      border:1px solid rgba(139,92,246,0.25);
      padding:3px 10px;border-radius:var(--r-pill);
    }
    .answer-close {
      background:none;border:none;color:var(--text-3);
      cursor:pointer;font-size:18px;line-height:1;
      padding:2px 6px;border-radius:5px;
      transition:color .2s,background .2s;
    }
    .answer-close:hover { color:var(--text-2);background:rgba(255,255,255,0.06); }
    .answer-section { margin-bottom:14px; }
    .answer-label {
      font-size:10px;font-weight:700;letter-spacing:0.8px;
      text-transform:uppercase;color:var(--text-3);margin-bottom:5px;
    }
    .answer-query-text {
      font-size:14px;font-weight:600;color:var(--text);line-height:1.5;
      padding-bottom:14px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .answer-divider {
      border:none;border-top:1px solid rgba(255,255,255,0.06);
      margin:14px 0;
    }
    /* chunk card embedded inside the answer panel */
    .answer-chunk {
      background:rgba(255,255,255,0.025);
      border:1px solid var(--border);
      border-radius:var(--r);padding:14px 16px;
      margin-top:8px;
    }
    .answer-chunk-title {
      font-size:13px;font-weight:600;color:var(--text);
      line-height:1.45;margin-bottom:9px;
    }
    .answer-chunk-title.empty { color:var(--text-3);font-style:italic; }
    .answer-error {
      font-size:13px;color:#f87171;
      background:rgba(239,68,68,0.08);
      border:1px solid rgba(239,68,68,0.2);
      border-radius:var(--r-sm);padding:10px 14px;
    }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- ── Header ──────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-mark">ΦΕΚ</div>
    <div>
      <div class="logo-name">FEK Search</div>
      <div class="logo-tag">Government Gazette · Semantic Search</div>
    </div>
  </div>
  <div class="header-right">
    <div class="api-status">
      <div class="dot" id="dot"></div>
      <span id="apiLabel">Connecting…</span>
    </div>
  </div>
</header>

<!-- ── Hero ────────────────────────────────────────────────── -->
<section class="hero">
  <div class="hero-eyebrow">
    <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="#3b82f6"/></svg>
    Semantic Search · Multilingual
  </div>
  <h1>Αναζητήστε στην<br><span>Εφημερίδα της Κυβερνήσεως</span></h1>
  <p class="hero-sub">Αναζήτηση σε νόμους, άρθρα και αποφάσεις με χρήση search engines</p>

  <div class="search-wrap">
    <svg class="search-ico" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input
      id="q"
      type="text"
      class="search-input"
      placeholder="π.χ. αμοιβαία αναγνώριση αδειών οδήγησης…"
      autocomplete="off" spellcheck="false"
    />
    <span class="search-kbd" id="kbd">⌘K</span>
    <div class="search-spin" id="spin"><div class="spinner"></div></div>
  </div>

  <!-- Generate Query button -->
  <div class="gen-row">
    <button id="genBtn" class="gen-btn" title="Επιλέγει τυχαίο chunk και δημιουργεί query + απάντηση μέσω OpenAI">
      <div class="gen-btn-spin" id="genSpin"><div class="spinner"></div></div>
      <span id="genLabel">✨ Δημιουργία Query Αξιολόγησης</span>
    </button>
  </div>

  <!-- Answer panel (hidden until a query is generated) -->
  <div id="answerPanel" class="answer-panel" style="display:none"></div>

</section>

<!-- ── Controls ─────────────────────────────────────────────── -->
<div class="controls">
  <div class="tabs">
    <button class="tab active" data-engine="mpnet">MPNET</button>
    <button class="tab" data-engine="novelcore">ORPHEAS</button>
    <button class="tab cmp" data-engine="compare">⚡ COMPARE</button>
  </div>
  <div class="topk-wrap">
    <label for="topk" style="font-size:12px;">Αποτελέσματα</label>
    <select id="topk">
      <option value="3">3</option>
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="20">20</option>
    </select>
  </div>
</div>

<!-- ── Main ─────────────────────────────────────────────────── -->
<main>
  <div class="stats" id="stats" style="display:none">
    <span id="statsLeft"></span>
    <span class="stats-time" id="statsRight"></span>
  </div>
  <div id="results"></div>
</main>

<script>
// Works both when served by FastAPI (/ui/) and opened directly as file://
const API = window.location.protocol === 'file:'
  ? 'http://localhost:8000'
  : window.location.origin;
let engine = 'mpnet';
let timer  = null;
let ctl    = null;

// ── Health check ──────────────────────────────────────────────
async function checkHealth() {
  const dot   = document.getElementById('dot');
  const label = document.getElementById('apiLabel');
  try {
    const r = await fetch(`${API}/health`, {signal: AbortSignal.timeout(3000)});
    if (r.ok) {
      const d = await r.json();
      dot.className  = 'dot on';
      label.textContent = 'API Online';
      return d;
    }
    throw new Error();
  } catch {
    dot.className  = 'dot off';
    label.textContent = 'API Offline';
  }
}
checkHealth();
setInterval(checkHealth, 30_000);

// ── Engine tabs ───────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    engine = t.dataset.engine;
    const q = document.getElementById('q').value.trim();
    if (q.length >= 2) run(q);
  });
});

// ── Search input ──────────────────────────────────────────────
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 2) { clear(); return; }
  timer = setTimeout(() => run(q), 340);
});

// ── ⌘K shortcut ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const inp = document.getElementById('q');
    inp.focus(); inp.select();
  }
});

// ── Run search ────────────────────────────────────────────────
function run(q) {
  if (ctl) ctl.abort();
  ctl = new AbortController();
  setLoading(true);
  const k = +document.getElementById('topk').value;
  engine === 'compare' ? runCompare(q, k) : runSingle(engine, q, k);
}

async function post(ep, query, topK) {
  const r = await fetch(`${API}/search/${ep}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query, top_k: topK}),
    signal: ctl.signal,
  });
  return r.json();
}

async function runSingle(eng, q, k) {
  const t0 = performance.now();
  try {
    const d = await post(eng, q, k);
    showSingle(d.results, Math.round(performance.now() - t0));
  } catch(e) { if (e.name !== 'AbortError') showError(); }
  finally { setLoading(false); }
}

async function runCompare(q, k) {
  const t0 = performance.now();
  try {
    const [dA, dB] = await Promise.all([
      post('mpnet', q, k).then(r=>r),
      post('novelcore', q, k).then(r=>r),
    ]);
    showCompare(dA.results, dB.results, Math.round(performance.now() - t0));
  } catch(e) { if (e.name !== 'AbortError') showError(); }
  finally { setLoading(false); }
}

// ── Render: single ────────────────────────────────────────────
function showSingle(results, ms) {
  const el = document.getElementById('results');
  setStats(results.length, ms);
  if (!results.length) { showEmpty(el); return; }
  el.innerHTML = `<div class="results-grid">${results.map(card).join('')}</div>`;
  bind(el);
}

// ── Render: compare ───────────────────────────────────────────
function showCompare(resA, resB, ms) {
  const el = document.getElementById('results');
  setStats(Math.max(resA.length, resB.length), ms, true);
  el.innerHTML = `
    <div class="results-grid cmp">
      <div class="col">
        <div class="col-head mpnet"><span class="col-dot"></span>MPNET</div>
        ${resA.map(card).join('')}
      </div>
      <div class="col">
        <div class="col-head novelcore"><span class="col-dot"></span>NOVELCORE</div>
        ${resB.map(card).join('')}
      </div>
    </div>`;
  bind(el);
}

// ── Card template ─────────────────────────────────────────────
function card(r) {
  const s = r.score;
  const cls   = s >= .8 ? 'high' : s >= .65 ? 'mid' : s >= .5 ? 'low' : 'poor';
  const color = s >= .8 ? '#10b981' : s >= .65 ? '#f59e0b' : s >= .5 ? '#f97316' : '#ef4444';
  const bar   = Math.round(s * 100);
  const id    = 't' + Math.random().toString(36).slice(2);

  const title = r.header
    ? `<span class="card-title">${esc(r.header)}</span>`
    : `<span class="card-title empty">Χωρίς τίτλο</span>`;

  const text = r.text
    ? `<div class="card-text" id="${id}">${esc(r.text.replace(/\n/g,' '))}</div>
       <button class="expand" data-id="${id}" data-open="0">Εμφάνιση περισσότερων ↓</button>`
    : '';

  return `
  <div class="card">
    <div class="card-top">
      <span class="card-rank">#${r.rank}</span>
      ${title}
      <div class="score ${cls}">
        <div class="score-mini-bar"><div class="score-mini-fill" style="width:${bar}%;background:${color}"></div></div>
        ${s.toFixed(3)}
      </div>
    </div>
    <div class="card-meta">
      <span class="chip chip-fek">ΦΕΚ ${esc(r.fek_id)}</span>
      <span class="chip chip-type">${esc(r.issue)}</span>
      <span class="chip chip-date">${esc(r.date)}</span>
      ${r.sheet_number ? `<span class="chip chip-date">Φ.${esc(r.sheet_number)}</span>` : ''}
    </div>
    ${text}
  </div>`;
}

// ── Expand/collapse ───────────────────────────────────────────
function bind(container) {
  container.querySelectorAll('.expand').forEach(btn => {
    btn.addEventListener('click', () => {
      const el   = document.getElementById(btn.dataset.id);
      const open = btn.dataset.open === '1';
      el.classList.toggle('open', !open);
      btn.dataset.open  = open ? '0' : '1';
      btn.textContent   = open ? 'Εμφάνιση περισσότερων ↓' : 'Λιγότερα ↑';
    });
  });
}

// ── Skeleton loader ───────────────────────────────────────────
function setLoading(on) {
  document.getElementById('spin').classList.toggle('show', on);
  document.getElementById('kbd').style.opacity = on ? '0' : '1';
  if (!on) return;

  document.getElementById('stats').style.display = 'none';
  const n = +document.getElementById('topk').value;
  document.getElementById('results').innerHTML =
    `<div class="results-grid">${Array.from({length:Math.min(n,5)}, () => `
    <div class="sk-card">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <div class="sk sk-line" style="width:22px"></div>
        <div class="sk sk-line" style="flex:1"></div>
        <div class="sk sk-line" style="width:70px;height:22px;border-radius:999px"></div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        ${[66,40,56,38].map(w=>`<div class="sk" style="width:${w}px;height:20px;border-radius:5px"></div>`).join('')}
      </div>
      <div class="sk sk-line" style="width:100%"></div>
      <div class="sk sk-line" style="width:88%"></div>
      <div class="sk sk-line" style="width:74%"></div>
    </div>`).join('')}</div>`;
}

// ── Helpers ───────────────────────────────────────────────────
function setStats(n, ms, compare) {
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('statsLeft').innerHTML =
    `<strong>${n}</strong> αποτελέσματα${compare ? ' ανά μοντέλο' : ''}`;
  document.getElementById('statsRight').textContent = `${ms} ms`;
}

function clear() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('stats').style.display = 'none';
}

function showEmpty(el) {
  el.innerHTML = `
    <div class="state">
      <div class="state-icon">🔍</div>
      <h3>Δεν βρέθηκαν αποτελέσματα</h3>
      <p>Δοκιμάστε διαφορετικούς όρους αναζήτησης.</p>
    </div>`;
  document.getElementById('stats').style.display = 'none';
}

function showError() {
  document.getElementById('results').innerHTML = `
    <div class="state">
      <div class="state-icon">⚠️</div>
      <h3>Σφάλμα σύνδεσης με το API</h3>
      <p>Βεβαιωθείτε ότι το API τρέχει:<br>
         <code>uvicorn fek.api.main:app --reload</code></p>
    </div>`;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Generate Query ────────────────────────────────────────────
const genBtn    = document.getElementById('genBtn');
const genSpin   = document.getElementById('genSpin');
const genLabel  = document.getElementById('genLabel');
const answerPanel = document.getElementById('answerPanel');

genBtn.addEventListener('click', generateQuery);

async function generateQuery() {
  // Loading state
  genBtn.disabled = true;
  genSpin.classList.add('show');
  genLabel.style.display = 'none';
  answerPanel.style.display = 'none';

  try {
    const r = await fetch(`${API}/generate/query`, {
      method: 'POST',
      signal: AbortSignal.timeout(30_000),
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      renderAnswerError(err.detail || `HTTP ${r.status} — σφάλμα δημιουργίας query`);
      return;
    }

    const d = await r.json();

    // Populate search input, focus it and trigger search
    const inp = document.getElementById('q');
    inp.value = d.query;
    inp.focus();
    inp.dispatchEvent(new Event('input'));   // kicks off the debounced search

    renderAnswerPanel(d);

  } catch (e) {
    if (e.name === 'TimeoutError') {
      renderAnswerError('Το αίτημα προς το OpenAI API έληξε (timeout 30s).');
    } else {
      renderAnswerError('Αδύνατη η σύνδεση με το API. Βεβαιωθείτε ότι ο server τρέχει.');
    }
  } finally {
    genBtn.disabled = false;
    genSpin.classList.remove('show');
    genLabel.style.display = '';
  }
}

function renderAnswerPanel(d) {
  const src   = d.chunk ?? d.source ?? {};
  const txtId = 'ap' + Math.random().toString(36).slice(2);

  const chips = [
    src.fek_id       ? `<span class="chip chip-fek">ΦΕΚ ${esc(String(src.fek_id))}</span>`     : '',
    src.issue        ? `<span class="chip chip-type">${esc(String(src.issue))}</span>`           : '',
    src.date         ? `<span class="chip chip-date">${esc(String(src.date))}</span>`            : '',
    src.sheet_number ? `<span class="chip chip-date">Φ.${esc(String(src.sheet_number))}</span>` : '',
    src.chunk_id != null ? `<span class="chip chip-date">id:${esc(String(src.chunk_id))}</span>` : '',
  ].join('');

  const titleHtml = src.header
    ? `<div class="answer-chunk-title">${esc(src.header)}</div>`
    : `<div class="answer-chunk-title empty">Χωρίς τίτλο</div>`;

  const textHtml = src.text
    ? `<div class="card-text" id="${txtId}">${esc(src.text.replace(/\n/g,' '))}</div>
       <button class="expand" data-id="${txtId}" data-open="0">Εμφάνιση περισσότερων ↓</button>`
    : '';

  answerPanel.style.display = 'block';
  answerPanel.innerHTML = `
    <div class="answer-head">
      <span class="answer-badge">✨ Αυτόματο Query Αξιολόγησης</span>
      <button class="answer-close"
              onclick="document.getElementById('answerPanel').style.display='none'"
              title="Κλείσιμο">×</button>
    </div>



    <hr class="answer-divider">

    <div class="answer-section">
      <div class="answer-label">Chunk Πηγής</div>
      <div class="answer-chunk">
        ${titleHtml}
        <div class="card-meta">${chips}</div>
        ${textHtml}
      </div>
    </div>`;

  // bind expand/collapse for the chunk text
  answerPanel.querySelectorAll('.expand').forEach(btn => {
    btn.addEventListener('click', () => {
      const el   = document.getElementById(btn.dataset.id);
      const open = btn.dataset.open === '1';
      el.classList.toggle('open', !open);
      btn.dataset.open = open ? '0' : '1';
      btn.textContent  = open ? 'Εμφάνιση περισσότερων ↓' : 'Λιγότερα ↑';
    });
  });
}

function renderAnswerError(msg) {
  answerPanel.style.display = 'block';
  answerPanel.innerHTML = `
    <div class="answer-head">
      <span class="answer-badge">✨ Αυτόματο Query Αξιολόγησης</span>
      <button class="answer-close" onclick="document.getElementById('answerPanel').style.display='none'"
              title="Κλείσιμο">×</button>
    </div>
    <div class="answer-error">⚠️ ${esc(msg)}</div>`;
}
</script>
</body>
</html>
